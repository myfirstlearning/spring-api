openapi: 3.1.0
info:
  title: 'OpenAPI Example'
  description: Specification for an OpenAPI example
  termsOfService: 'https://www.example.com/terms'
  version: 1.0.0
  contact:
    name: 'API Support'
    email: '123@gmail.com'
  license:
    name: 'Apache 2.0'
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: 'http://localhost:8080/hello'
    description: 'Local server for testing'
    variables:
      port:
        default: '8080'
        description: Port number for the server
        enum:
          - '8080'
          - '9090'
          - '8000'
  - url: 'https://api.example.com/v1'
    description: 'Production server'
    variables:
      port:
        default: '443'
        description: Port number for the production server
        enum:
          - '443'
          - '8443'
tags:
  - name: 'Pet'
    description: 'Operations related to pets'
  - name: 'Customer'
    description: 'Operations related to customers'
paths:
  /pet/{petId}:
    get:
      tags:
        - 'Pet'
      summary: 'Get a pet by ID'
      description: 'Returns a single pet'
      operationId: 'getPetById'
      parameters:
        - name: petId
          in: path
          required: true
          description: 'ID of the pet to fetch'
          schema:
            type: string
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  tag:
                    type: string
        '404':
          description: 'Pet not found'
  /v1/customers:
    get:
      tags:
        - 'Customer'
      summary: 'Get all customers'
      description: 'Returns a list of customers'
      responses:
        '200':
          description: 'Successful response'